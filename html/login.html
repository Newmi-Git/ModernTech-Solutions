<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Login — ModernTech Solutions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="login-body">
  <div class="login-page">
    <div class="login-image">
      <div class="brand-animation">
        <div class="orbit-ring ring-1"></div>
        <div class="orbit-ring ring-2"></div>
        <div class="orbit-ring ring-3"></div>
        <div class="brand-core">
          <div class="brand-icon">
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
          </div>
        </div>
        <div class="brand-text">
          <p class="brand-name">ModernTech</p>
          <p class="brand-sub">Solutions</p>
        </div>
        <div class="particle p1"></div>
        <div class="particle p2"></div>
        <div class="particle p3"></div>
        <div class="particle p4"></div>
      </div>
    </div>

    <div class="login-details" id="login-app">
      <h1>ModernTech Solutions</h1>

      <label>Email:</label>
      <input type="email" v-model="email" :disabled="loading">
      <label>Password:</label>
      <input type="password" v-model="password" :disabled="loading">
      <button class="login-button" type="button" @click="handleLogin" :disabled="loading">
        {{ loading ? 'Logging in…' : 'Log In' }}
      </button>

      <p v-if="error" style="color:#c0392b; font-size:12px;">{{ error }}</p>
    </div>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    const { createApp } = Vue;
    createApp({
      data() {
        return { email: '', password: '', error: '', loading: false };
      },
      methods: {
        async handleLogin() {
          this.error = '';
          if (!this.email || !this.password) {
            this.error = 'Please enter both email and password.';
            return;
          }
          this.loading = true;
          const result = await loginUser(this.email, this.password);
          this.loading = false;
          if (result.success) {
            // HR/manager land on the dashboard; plain employees land on their own view.
            window.location.href = (result.role === 'hr' || result.role === 'manager')
              ? 'index.html'
              : 'about.html';
          } else {
            this.error = result.message;
          }
        }
      }
    }).mount('#login-app');
  </script>
</body>
</html>
