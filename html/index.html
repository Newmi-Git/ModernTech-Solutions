<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ModernTech Solutions - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-box {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #9b59b6;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #9b59b6;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #8e44ad;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            color: #d9534f;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>ModernTech Solutions</h1>

            <p class="subtitle">Employee Login</p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit">
                    Login
                </button>

                <p id="message"></p>

            </form>

        </div>

    </div>


    <script>

        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");


        loginForm.addEventListener("submit", async (e) => {

            e.preventDefault();


            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;


            try {

                const response = await fetch("http://localhost:5000/auth/login", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })

                });


                const result = await response.json();


                if (result.success) {

                    // Save login information
                    localStorage.setItem("token", result.token);
                    localStorage.setItem("role", result.role);
                    localStorage.setItem("employeeId", result.employeeId);


                    // Redirect based on role
                    if (result.role === "admin") {

                        window.location.href = "admin.html";

                    } else {

                        window.location.href = "employee.html";

                    }

                } else {

                    message.textContent = result.message || "Invalid email or password.";

                }


            } catch (error) {

                console.error("Login error:", error);

                message.textContent =
                    "Unable to connect to the server.";

            }

        });

    </script>

</body>
</html>
